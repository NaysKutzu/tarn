[package]
name = "tarn"
version = "0.1.4"
description = "YouTube Music desktop client"
authors = ["Alex Stefan"]
license = "GPL-3.0-only"
edition = "2021"
default-run = "tarn"

[lib]
name = "tarn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tarn"
path = "src/main.rs"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[[bin]]
name = "soak"
path = "src/bin/soak.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rustypipe = { version = "0.11", default-features = false, features = ["rustls-tls-webpki-roots", "userdata"] }
rodio = { version = "0.20", features = ["symphonia-isomp4", "symphonia-aac"] }
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
anyhow = "1"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
parking_lot = "0.12"
chacha20poly1305 = "0.10"
rand = "0.8"
sha1 = "0.10"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
url = "2"
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "anyhow", "reqwest", "rustls"] }


[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }


[target.'cfg(not(any(target_os = "linux", target_os = "macos", windows)))'.dependencies]
keyring = { version = "3", default-features = false }

[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
souvlaki = "0.7"
global-hotkey = "0.7"
notify-rust = "4"
discord-rich-presence = "1.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri = { version = "2", features = ["tray-icon"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[profile.release]
lto = false
codegen-units = 8
opt-level = 3
strip = true

# rustypipe's JS engine ships no prebuilt bindings for Android: generate them.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
rquickjs-sys = { version = "0.9", features = ["bindgen"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# iOS: lock-screen Now Playing, remote commands and the playback audio session.
[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-avf-audio = "0.3"
objc2-foundation = "0.3"
objc2-media-player = "0.3"
