# docker compose up -d --build
# Serves on 127.0.0.1:47821, point your tunnel / reverse proxy at it.
services:
  jam:
    build: .
    restart: unless-stopped
    environment:
      TARN_JAM_PASSWORD: ${TARN_JAM_PASSWORD:-}
      TARN_JAM_MAX_ROOMS: ${TARN_JAM_MAX_ROOMS:-1000}
      TARN_JAM_MAX_ROOMS_PER_IP: ${TARN_JAM_MAX_ROOMS_PER_IP:-3}
      # Always behind a proxy/tunnel, so read the real client IP from X-Forwarded-For.
      TARN_JAM_TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:47821:47821"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
