# Default (just the server, on 127.0.0.1:47821):
#   docker compose up -d --build
# With a Cloudflare Tunnel:
#   TUNNEL_TOKEN=... docker compose --profile tunnel up -d --build
# With Caddy + automatic HTTPS instead:
#   DOMAIN=jam.example.com docker compose --profile caddy up -d --build
services:
  jam:
    build: .
    restart: unless-stopped
    environment:
      TARN_JAM_PASSWORD: ${TARN_JAM_PASSWORD:-}
      TARN_JAM_MAX_ROOMS: ${TARN_JAM_MAX_ROOMS:-1000}
      TARN_JAM_MAX_ROOMS_PER_IP: ${TARN_JAM_MAX_ROOMS_PER_IP:-3}
      # Always behind a proxy/tunnel, so read the real client IP from X-Forwarded-For.
      TARN_JAM_TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:47821:47821"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # Cloudflare Tunnel. In the dashboard, point jam.694206767.xyz at http://jam:47821
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [jam]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  caddy:
    profiles: [caddy]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [jam]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

volumes:
  caddy_data:
  caddy_config:
