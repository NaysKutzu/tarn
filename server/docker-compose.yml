# One command:  DOMAIN=jam.example.com TARN_JAM_PASSWORD=pick-something docker compose up -d --build
services:
  jam:
    build: .
    restart: unless-stopped
    environment:
      TARN_JAM_PASSWORD: ${TARN_JAM_PASSWORD:-}
      TARN_JAM_MAX_ROOMS: ${TARN_JAM_MAX_ROOMS:-1000}
      TARN_JAM_TRUST_PROXY: "1"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Only reachable through Caddy, never published directly.
    expose: ["47821"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [jam]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

volumes:
  caddy_data:
  caddy_config:
