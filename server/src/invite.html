<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Listen along on Tarn</title>
<style>
:root{color-scheme:dark;--bg:#14130f;--card:#1d1b17;--line:#2e2b25;--text:#f1ede4;--dim:#9a948a;--accent:#e0a45a}
@media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#f6f3ec;--card:#fff;--line:#e3ddd0;--text:#1c1a16;--dim:#6f695e}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px}
h1{margin:0 0 6px;font-size:22px;letter-spacing:-.01em}p{margin:0 0 18px;color:var(--dim)}
.btn{display:block;width:100%;text-align:center;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;font-weight:600;text-decoration:none;cursor:pointer;margin-top:10px}
.btn.main{background:var(--accent);border-color:var(--accent);color:#1a1209}
code{display:block;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:12px;word-break:break-all;color:var(--dim);user-select:all}
small{display:block;margin-top:18px;color:var(--dim);font-size:12px}
</style></head><body><main>
<h1>Listen along on Tarn</h1>
<p>A friend invited you to listen together. Their music plays in sync on your side.</p>
<a class="btn main" id="open" href="#">Open in Tarn</a>
<button class="btn" id="copy" type="button">Copy join code</button>
<code id="code"></code>
<a class="btn" href="https://github.com/rexsystems/tarn/releases/latest" rel="noopener">Don't have Tarn? Get it</a>
<small>In Tarn: open the Listen along button in the player bar, paste the code and press Join.</small>
</main>
<script>
var code=location.href;
document.getElementById('code').textContent=code;
document.getElementById('open').href='tarn://join?code='+encodeURIComponent(code);
document.getElementById('copy').onclick=function(){var b=this;(navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(function(){b.textContent='Copied'},function(){b.textContent='Select the code above and copy it'})};
</script></body></html>
