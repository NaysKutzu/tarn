name: Mobile

# Best-effort Android / iOS builds. Failures do not block desktop releases.
# Trigger manually, or after a GitHub Release is published.

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  android:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@7731365548f3f81c15d4c49c8f1d29101e02cdcf # v4.0.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable @ 2026-10
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libssl-dev pkg-config libdbus-1-dev libasound2-dev libclang-dev

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Init and build APK
        run: |
          if [ -z "${NDK_HOME:-}" ]; then
            export NDK_HOME="${ANDROID_NDK_HOME:-}"
          fi
          if [ -z "${NDK_HOME:-}" ] && [ -d "${ANDROID_SDK_ROOT:-}/ndk" ]; then
            ver=$(ls -1 "$ANDROID_SDK_ROOT/ndk" | tail -1)
            [ -n "$ver" ] && export NDK_HOME="$ANDROID_SDK_ROOT/ndk/$ver"
          fi
          echo "NDK_HOME=${NDK_HOME:-unset}"
          # rquickjs-sys generates its bindings with libclang: point it at the NDK headers.
          T="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          CL=$(ls -d "$T"/lib/clang/*/include | head -1)
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=$T/sysroot -nostdinc -isystem $CL -isystem $T/sysroot/usr/include/aarch64-linux-android -isystem $T/sysroot/usr/include"
          # gen/android is committed (it holds the media service + login activity).
          [ -d src-tauri/gen/android ] || npx tauri android init --ci || npx tauri android init
          npx tauri android build --apk --debug --target aarch64

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: tarn-android-apk
          path: |
            src-tauri/gen/android/**/*.apk
          if-no-files-found: warn

      - name: Attach APK to release
        if: success() && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar nullglob
          files=(src-tauri/gen/android/**/*.apk)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber
          fi

  ios:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable @ 2026-10
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Init and build (unsigned)
        run: |
          npx tauri ios init --ci || npx tauri ios init
          # Tauri shells out to `xcodebuild`; wrap it so every build is unsigned
          # (AltStore / SideStore re-sign on install).
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/xcodebuild" <<'WRAP'
          #!/bin/bash
          for a in "$@"; do
            if [ "$a" = "-exportArchive" ]; then exec /usr/bin/xcodebuild "$@"; fi
          done
          exec /usr/bin/xcodebuild "$@" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=
          WRAP
          chmod +x "$RUNNER_TEMP/bin/xcodebuild"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          # The export step needs signing and may fail; the .app is still built.
          npx tauri ios build --debug || echo "tauri ios build exited non-zero"

      - name: Package unsigned IPA (for sideloading)
        run: |
          # Prefer the real build product; the archive intermediates copy can be empty.
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path '*/Build/Products/*iphoneos*' -name '*.app' -prune 2>/dev/null | head -1)
          [ -n "$APP" ] || APP=$(find src-tauri/gen/apple ~/Library/Developer/Xcode/DerivedData -path '*iphoneos*' -name '*.app' -prune 2>/dev/null | head -1)
          echo "app bundle: ${APP:-none}"
          if [ -z "$APP" ]; then echo "::error::no .app produced"; exit 1; fi
          du -sh "$APP"; ls -la "$APP"
          if [ ! -f "$APP/Info.plist" ] || [ "$(du -sk "$APP" | cut -f1)" -lt 1000 ]; then echo "::error::.app looks empty"; exit 1; fi
          rm -rf ipa-out && mkdir -p ipa-out/Payload
          cp -R "$APP" ipa-out/Payload/
          (cd ipa-out && zip -qry Tarn-unsigned.ipa Payload)
          ls -la ipa-out

      - name: Upload iOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: tarn-ios
          path: |
            ipa-out/Tarn-unsigned.ipa
            src-tauri/gen/apple/**/*.ipa
          if-no-files-found: warn
